# learned-linked.yaml with the linker retrained on learned v1 fragments of
# ltrain (step A: $WT_BENCHMARK_DATA/salience/linker-learned-v1.npz, best
# link threshold 0.7; not packaged). The step-A baseline A-v1m-relinked
# (learned v1 with mirrored edges): IDF1 0.739 / 0.723 on ldev / ldev-field.
detector:
  method: learned
  threshold: 0.6
harmonic_groups:
  low_thresh_factor: 4.0
  high_thresh_factor: 7.0
  min_group_size: 2
tracking:
  min_support: 3
  gap_tolerance: 0.5
  gap_tolerance_rate: 0.1
linking:
  model: /home/weygoldt/wrk/data/wavetracker_benchmark/salience/linker-learned-v1.npz
  threshold: 0.7
  enabled: true
