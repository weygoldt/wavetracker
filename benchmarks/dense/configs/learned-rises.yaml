# learned-b.yaml with the rise joiner (wavetracker.rises, section `rises`):
# after linking, an identity that stops is joined to one that starts within
# 5 s after it (or up to 4 s before: the detector's ghost tail of the old
# frequency), 1.5-35 Hz higher, if their electrode patterns agree (rms <= 7 dB,
# correlation >= 0.5) and both are confident (mean salience >= 0.4).
# ldev / ldev-field IDF1 0.773 / 0.762 (learned-b 0.752 / 0.741).
# Detector threshold 0.5 instead of 0.6 (2026-11-12): 51 dev mixtures (ldev +
# ldev2), lab / field IDF1 0.771 / 0.763 against 0.766 / 0.759 (+0.0043
# [+0.0006, +0.0080], 69 better, 33 worse); long false identities 0.51 -> 0.29
# per mixture, harmonic detections 0.13 -> 0.20 per frame.
detector:
  method: learned
  threshold: 0.5
  model: /home/weygoldt/wrk/data/wavetracker_benchmark/salience/B-det-tcn64aug-s0/last.pt
harmonic_groups:
  high_thresh_factor: 7.0
  low_thresh_factor: 4.0
  min_group_size: 2
linking:
  enabled: true
  max_parallel: 0.6
  max_shared: 0.3
  model: /home/weygoldt/wrk/data/wavetracker_benchmark/assoc/linker-learned-v1-motion2.npz
  threshold: 0.6
rises:
  enabled: true
tracking:
  gap_tolerance: 0.5
  gap_tolerance_rate: 0.1
  min_identity_salience: 0.75
  min_support: 3
  motion_window: 2.0
# Confidences and review flags (wavetracker.review, docs/review-flags.md):
# review.json with the identities, joins and rejected joins most likely wrong,
# calibrated on ltrain for this pipeline (benchmarks/dense/review.py, E-cf-rises-t05).
# The identities do not change.
review:
  enabled: true
  model: /home/weygoldt/wrk/data/wavetracker_benchmark/confidence/E-cf-rises-t05/model-v1.npz
