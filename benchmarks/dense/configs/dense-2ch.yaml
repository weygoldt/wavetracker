# dense.yaml with only two of the nine electrodes (a 2-electrode array, as in
# boat surveys); level-ratio patterns for tracking, as docs/field-recordings.md.
harmonic_groups:
  low_thresh_factor: 4.0
  high_thresh_factor: 7.0
  min_group_size: 2
spectrogram:
  exclude_channels: [2, 3, 4, 5, 6, 7, 8]
tracking:
  min_support: 3
  gap_tolerance: 0.5
  gap_tolerance_rate: 0.1
  amplitude_feature: db
stitching:
  max_dropout: 60.0
  baseline_tolerance: 1.0
  rise_baseline_tolerance: 2.0
  dropout_tolerance: 0.5
  overlap_tolerance: 1.0
linking:
  enabled: false  # the rule-based stitching below (the baseline)
