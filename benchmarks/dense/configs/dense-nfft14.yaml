# dense.yaml at half the frequency resolution (1.22 Hz, 82 ms frames at 20 kHz):
# closer to field recordings at 48 kHz with nfft 2**15 (1.46 Hz, 68 ms).
harmonic_groups:
  low_thresh_factor: 4.0
  high_thresh_factor: 7.0
  min_group_size: 2
spectrogram:
  nfft: 16384
tracking:
  min_support: 3
  gap_tolerance: 0.5
  gap_tolerance_rate: 0.1
stitching:
  max_dropout: 60.0
  baseline_tolerance: 1.0
  rise_baseline_tolerance: 2.0
  dropout_tolerance: 0.5
  overlap_tolerance: 1.0
