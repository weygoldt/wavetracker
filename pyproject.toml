[project]
name = "wavetracker"
version = "0.3.0"
description = "Detect and track the EOD frequencies of wave-type electric fish in long multi-electrode recordings."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11,<3.15"
authors = [
    { name = "Till Raab" },
    { name = "Joerg Henninger" },
]
maintainers = [
    { name = "Patrick Weygoldt", email = "patrick.weygoldt@uni-tuebingen.de" },
    { name = "Jan Benda", email = "jan.benda@uni-tuebingen.de" },
]
keywords = ["electric fish", "spectrogram", "tracking", "neuroethology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=2.4",
    "scipy>=1.17",
    "numba>=0.68",
    "torch>=2.14",
    "thunderlab>=1.8",
    "audioio>=2.8",
    "matplotlib>=3.11",
    "pandas>=3.0",
    "pyyaml>=6.0",
    "rich>=15.0",
    "typer>=0.27",
]

[project.optional-dependencies]
gui = ["pyqt5>=5.15"]

[project.scripts]
wavetracker = "wavetracker.cli:app"

[project.urls]
Repository = "https://github.com/weygoldt/wavetracker"
Paper = "https://doi.org/10.3389/fnint.2022.965211"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wavetracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests",
    "data: tests that need the recordings on /mnt/data2 (skipped if absent)",
]

[tool.ruff]
line-length = 88
target-version = "py311"
# Legacy GUI and contributed post-processing scripts are kept as-is for now.
extend-exclude = ["wavetracker/gui", "wavetracker/postprocessing", "tests/legacy_tracking.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = ["E501"]
