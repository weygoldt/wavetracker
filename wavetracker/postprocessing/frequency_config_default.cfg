# Default unified configuration for frequency_analysis.py
# Combines extraction and analysis settings in one file
#
# Search hierarchy:
# 1. Explicitly provided config file (--config)
# 2. frequency_config.cfg in parent directory of data folders
# 3. frequency_config.cfg in data folder
# 4. frequency_config_default.cfg in script directory (this file)
# 5. Hardcoded defaults
#
# All parameters can be overridden via command-line arguments

[extraction]
# Number of top frequencies to extract at each timepoint
n_fish = 5

# Time window around each timepoint
# Can be specified in seconds (e.g., 600) or minutes (e.g., 10min)
window_duration = 60min

# Method for ranking frequencies
# Options: occurrence (most frequently detected) or power (highest signal strength)
method = occurrence

# Frequency tolerance for merging duplicate signals during extraction (Hz)
# If two signals are within this distance, only the higher-ranked one is kept
freq_tolerance = 3.0

# Bandpass filter for fundamental frequencies (Hz)
# Only frequencies within this range will be considered
# Comment out or set to empty to disable filtering
min_freq = 405
max_freq = 820

# Daily timepoints (comma-separated HH:MM format)
# These times are matched relative to the recording start timestamp
timepoints = 07:30, 10:30, 13:30, 16:30, 19:30, 22:30, 01:30, 04:30


[analysis]
# Enable or disable temporal trace analysis
# If false, script outputs only extracted frequencies CSV
# If true, script connects traces across time and generates plots
run_analysis = true

# Frequency tolerance for connecting traces between consecutive timepoints (Hz)
# Fish EOD frequencies change with temperature (Q10 ~ 1.5)
# Increase this if traces are fragmented into many short segments
# Decrease if fish are incorrectly merged together
trace_tolerance = 10.0
