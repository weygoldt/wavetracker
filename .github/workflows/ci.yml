name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The ends of the supported range: numpy and scipy fork at 3.12.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run ruff check wavetracker tests scripts
      - run: uv run ruff format --check wavetracker tests scripts
      - if: matrix.python-version != '3.14'
        run: uv run pytest -q
      # One leg measures coverage, so the other runs at full speed.
      - if: matrix.python-version == '3.14'
        run: uv run pytest -q --cov=wavetracker --cov-report=term --cov-report=json
      - if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.json
          retention-days: 7

  # Draws the coverage badge and force-pushes it as the only commit of the
  # orphan `badges` branch, which the README shows.  Pushes to master of this
  # repository only: never pull requests, never forks.
  badge:
    needs: test
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master'
      && github.repository == 'weygoldt/wavetracker'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: coverage
      - name: Publish badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="$RUNNER_TEMP/badges"
          python3 scripts/coverage_badge.py coverage.json "$out/coverage.svg"
          cd "$out"
          git init -q -b badges
          git add coverage.svg
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Coverage badge for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:badges
