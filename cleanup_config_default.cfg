# Cleanup Configuration File
# This file contains parameters for the wavetracker cleanup script
# Place this file in the same folder as your wavetracker output or specify with --config

[parameters]
# Sliding window size in minutes for frequency distribution analysis
# Larger values = more robust to noise, less temporal resolution
# Default: 10 (high resolution), Multi-day: 60-360
stride_minutes = 10

# Window overlap fraction (0.0 to 1.0)
# Higher values = better continuity between windows
# Default: 0.2, Multi-day: 0.5
overlap_frac = 0.2

# Frequency tolerance in Hz for matching tracks
# Accounts for frequency drift over time
# Default: 2.5, Multi-day: 10-15
freq_tolerance = 2.5

# Time gap tolerance in minutes for bridging disconnected tracks
# Larger values allow longer gaps in detection
# Default: 5, Multi-day: 60-180
time_tolerance_minutes = 5

# Minimum detection density (0.0 to 1.0)
# Fraction of timepoints where fish must be detected
# Lower values accept sparser tracks
# Default: 0.1, Weak signals: 0.01-0.05
density_threshold = 0.1

# Number of fish to track
# Script will output the N longest/best tracks
n_fish = 2

[presets]
# Uncomment one of these sections to use preset values
# You can copy values from presets to [parameters] section above

